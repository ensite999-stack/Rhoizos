name: Verify Rhoizos
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run check
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, pdo_sqlite, intl, mbstring
      - run: find fossbilling scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/core.php
      - run: bash -n scripts/install.sh
